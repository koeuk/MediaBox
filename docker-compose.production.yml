# Standalone production stack. Reuses the base builds and data volume names.
# docker compose --env-file .env.production -f docker-compose.production.yml up -d --build --remove-orphans
services:
  db:
    extends:
      file: docker-compose.yml
      service: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}

  backend:
    extends:
      file: docker-compose.yml
      service: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root@db:3306/mediabox?charset=utf8mb4
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.production}
      ALLOW_PRIVATE_URLS: 'false'
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-3}
      MAX_DOWNLOAD_SIZE_MB: ${MAX_DOWNLOAD_SIZE_MB:-2048}
    # The backend is reachable only on the private Compose network.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, '--forwarded-allow-ips=*']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_COOKIE_SECURE: 'true'
      HOST: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  mysql_data:
  media_data:
  caddy_data:
  caddy_config:
