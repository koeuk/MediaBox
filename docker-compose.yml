services:
  db:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mediabox}
      MYSQL_DATABASE: mediabox
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD:-mediabox}@db:3306/mediabox?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MEDIA_DIR: /app/media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # Browser calls go through nginx, so a relative base works everywhere
      NUXT_PUBLIC_API_BASE: /api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  media_data:
